name: Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  propose-upstream-update:
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch upstream
        id: upstream
        run: |
          git remote add upstream https://github.com/huilang-me/CF-Server-Monitor.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
            echo "branch=sync/upstream-$(git rev-parse --short=12 upstream/main)" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare merge branch
        id: merge
        if: steps.upstream.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          if gh pr list --base main --head "$BRANCH" --state open --json number --jq 'length' | grep -qx '1'; then
            echo 'An upstream sync PR is already open.'
            echo 'created=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          if ! git merge --no-ff --no-edit upstream/main; then
            git merge --abort
            ISSUE=$(gh issue list --state open --search 'Upstream sync conflict in:title' --json number --jq '.[0].number // empty')
            if [ -z "$ISSUE" ]; then
              gh issue create --title 'Upstream sync conflict' --body "The upstream main branch at $(git rev-parse upstream/main) cannot merge into this fork's main automatically. Resolve the merge locally and open a PR."
            fi
            exit 1
          fi
          echo 'created=true' >> "$GITHUB_OUTPUT"

      - name: Verify merged code
        if: steps.merge.outputs.created == 'true'
        run: |
          npm ci
          npm run test:all
          npm run build:frontend

      - name: Open sync PR
        if: steps.merge.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Sync upstream main ($(git rev-parse --short upstream/main))" \
            --body 'Merge upstream changes while preserving the domain monitor. Review the diff and CI result before merging. Merging this PR triggers deployment.'
          gh workflow run check.yml --ref "$BRANCH"
